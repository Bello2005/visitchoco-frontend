# Caché del frontend de VisitChocó en nginx (visitchoco.dirsoft.cloud).
#
# Se incluye dentro del bloque `server { ... }` del sitio, en lugar del antiguo `location /assets/`:
#     include /var/www/visitchoco/frontend/deploy/nginx/cache.conf;
# y luego:  nginx -t && systemctl reload nginx
#
# Quien vuelve al sitio no descarga de nuevo el código, las fuentes ni las fotos.
#
# Ojo con nginx: un `add_header` dentro de un `location` borra los `add_header` heredados del server.
# Por eso cada bloque vuelve a incluir los encabezados de seguridad.

# Código y estilos de Vite: el nombre lleva una huella del contenido (index-BrnC5yy9.js), así que nunca
# cambian bajo el mismo nombre. Un año, sin volver a preguntar.
location /assets/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Copias de las fotos (pnpm fotos) y fuentes: sin huella en el nombre, así que 30 días y, pasado ese
# tiempo, el navegador sigue mostrando la suya mientras pregunta si cambió.
location ^~ /images/opt/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri =404;
}

location ^~ /fonts/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri =404;
}

# Fotos originales y datos: un día.
location ^~ /images/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

location ^~ /data/ {
    include snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

# La página en sí nunca se guarda sin preguntar: así cada publicación nueva se ve al instante.
location = /index.html {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}
